name: Build pipeline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target: all | client | server'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server
      pr_number:
        description: 'PR number (informational — used for logging)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build PMM (${{ github.event.inputs.target }})
    runs-on: [self-hosted, linux, x64, cloud]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy the cached repos
        run: |
          ls -la /opt/cache/repos
          # mkdir -p ${{ github.workspace }}/repos
          cp -r /opt/cache ${{ github.workspace }}/
          ls -la ${{ github.workspace }}/cache/repos

      # - name: Build
      #   run: |
      #     cd build/pipeline
      #     make build-${{ github.event.inputs.target }}
