name: Feature Build

on:
  issue_comment:
    types: [created]

jobs:
  build:
    name: PMM #${{ github.event.issue.number }}
    runs-on: [self-hosted, linux, x64, cloud]
    # Only handle PR comments that start with @pmm-bot
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '@pmm-bot')
    permissions:
      issues: write        # post comments and reactions
      pull-requests: write
      actions: write       # trigger workflow_dispatch

    steps:
      - name: Acknowledge comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            });

      # - name: Checkout
      #   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body        = context.payload.comment.body.trim();
            const sender      = context.payload.comment.user.login;
            const owner       = context.repo.owner;
            const repo        = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const commentId   = context.payload.comment.id;

            // ── 1. Permission check ──────────────────────────────────────────
            let permission;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: sender,
              });
              permission = data.permission;
            } catch (e) {
              // Non-collaborators get a 404 from this endpoint.
              permission = 'none';
            }

            if (!['write', 'admin'].includes(permission)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `@${sender} You need write access to trigger bot commands.`,
              });
              return;
            }

            // ── 2. Resolve the PR branch ─────────────────────────────────────
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issueNumber,
            });
            const ref = pr.head.ref;

            // ── 3. Parse command ─────────────────────────────────────────────
            // Strip the "@pmm-bot " prefix and normalise whitespace.
            const cmd = body.replace(/^@pmm-bot\s+/i, '').trim().toLowerCase();

            const DISPATCH_COMMANDS = {
              'run api tests': { workflow: 'api-tests.yml', inputs: { branch: ref } },
            };

            const BUILD_COMMANDS = {
              'build all':    'all',
              'build client': 'client',
              'build server': 'server',
            };

            const HELP_TEXT =
              '**Available commands:**\n' +
              '- `@pmm-bot build all` — build client + server\n' +
              '- `@pmm-bot build client` — build client only\n' +
              '- `@pmm-bot build server` — build server only\n' +
              '- `@pmm-bot run API tests` — run API test suite\n' +
              '- `@pmm-bot help` — show this message\n';

            if (cmd === 'help') {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body: HELP_TEXT,
              });
              return;
            }

            if (cmd in BUILD_COMMANDS) {
              core.setOutput('target', BUILD_COMMANDS[cmd]);
              return;
            }

            if (!(cmd in DISPATCH_COMMANDS)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `Unknown command: \`${cmd}\`\n\n${HELP_TEXT}`,
              });
              return;
            }

            // ── 4. Dispatch ──────────────────────────────────────────────────
            const { workflow, inputs } = DISPATCH_COMMANDS[cmd];
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: workflow,
              ref,
              inputs: { ...inputs },
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            });

            // ── 5. Confirm ───────────────────────────────────────────────────
            const runsUrl =
              `https://github.com/${owner}/${repo}/actions/workflows/${workflow}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `@${sender} Dispatched \`${cmd}\` on branch \`${ref}\`. [View runs](${runsUrl})`,
            });

      - name: Restore cache
        if: steps.command.outputs.target != ''
        run: |
          cp -r /opt/cache ${{ github.workspace }}/
          ls -la ${{ github.workspace }}/cache/repos

      - name: Build PMM
        if: steps.command.outputs.target != ''
        run: |
          curl -sSL https://raw.githubusercontent.com/percona/pmm/v3/build/pipeline/scripts/bootstrap | bash -s -- --target=${{ steps.command.outputs.target }} --skip-cache
